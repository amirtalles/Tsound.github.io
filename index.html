<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsound</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

/* ===== INTRO ===== */
#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .7s ease, visibility .7s ease;
}

#intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#intro video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* شفاف؛ فقط ناحیه‌ی Tap it قابل لمس است */
#tap-area {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 34vw;
    height: 18vw;
    max-width: 300px;
    max-height: 160px;
    min-width: 180px;
    min-height: 100px;
    background: transparent;
    border: 0;
    cursor: pointer;
    z-index: 2;
    padding: 0;
}

/* ===== MAIN SITE ===== */
header {
    padding: 30px 20px;
    text-align: center;
    background: #181818;
}

header h1 {
    margin: 0;
    font-size: 36px;
}

header p {
    color: #aaa;
}

nav {
    text-align: center;
    padding: 15px;
    background: #222;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px;
}

.post {
    background: #1d1d1d;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 15px;
}

.post h2 {
    margin-top: 0;
}

.button {
    display: inline-block;
    background: #ff5500;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media (max-width: 600px) {
    header h1 { font-size: 30px; }

    nav a {
        margin: 0 5px;
        font-size: 14px;
    }

    .container {
        padding: 15px;
    }

    #tap-area {
        width: 58vw;
        height: 28vw;
        min-width: 180px;
        min-height: 90px;
    }
}
</style>
</head>

<body>

<!-- ===== INTRO VIDEO ===== -->
<div id="intro">
    <video id="introVideo"
           autoplay
           muted
           playsinline
           preload="auto">
        <source src="intro.mp4" type="video/mp4">
        مرورگر شما از پخش ویدئو پشتیبانی نمی‌کند.
    </video>

    <!-- کاملاً شفاف؛ روی Tap it وسط ویدئو -->
    <button id="tap-area" aria-label="Tap it"></button>
</div>

<!-- ===== MAIN SITE ===== -->
<header>
    <h1>Tsound</h1>
    <p>وبلاگ موسیقی و هنر</p>
</header>

<nav>
    <a href="#">خانه</a>
    <a href="#">موسیقی</a>
    <a href="#">نوشته‌ها</a>
    <a href="#">درباره من</a>
</nav>

<div class="container">

    <div class="post">
        <h2>به وبلاگ Tsound خوش آمدید 🎵</h2>
        <p>
            اینجا می‌توانید اخبار، آهنگ‌ها، موزیک‌ویدیوها
            و مطالب جدید موسیقی را دنبال کنید.
        </p>
        <a class="button" href="#">ادامه مطلب</a>
    </div>

    <div class="post">
        <h2>آخرین آهنگ</h2>
        <p>به‌زودی آهنگ‌های جدید در این قسمت قرار می‌گیرند.</p>
    </div>

</div>

<footer>
    © 2026 Tsound
</footer>

<script>
const intro = document.getElementById("intro");
const video = document.getElementById("introVideo");
const tapArea = document.getElementById("tap-area");

function enterSite() {
    intro.classList.add("hide");

    setTimeout(() => {
        intro.remove();
    }, 750);
}

/* لمس Tap it در مرکز */
tapArea.addEventListener("click", enterSite);

/* روی موبایل */
tapArea.addEventListener("touchend", (event) => {
    event.preventDefault();
    enterSite();
}, { passive: false });

/* اگر ویدئو خودش تمام شد، صفحه اصلی باز شود */
video.addEventListener("ended", enterSite);
</script>

</body>
</html>
