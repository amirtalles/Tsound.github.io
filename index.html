<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsound</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

/* =========================
   INTRO / SPLASH SCREEN
========================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;

    background: #000;

    display: flex;
    justify-content: center;
    align-items: center;

    transition: opacity 0.8s ease, visibility 0.8s ease;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* GIF */

#intro img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Skip Button */

#skipBtn {
    position: absolute;
    top: 25px;
    left: 25px;

    background: rgba(255,255,255,0.15);
    color: white;

    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 30px;

    padding: 10px 20px;

    cursor: pointer;

    font-size: 14px;

    backdrop-filter: blur(5px);

    transition: 0.3s;
}

#skipBtn:hover {
    background: rgba(255,255,255,0.3);
}

/* =========================
   MAIN WEBSITE
========================= */

header {
    padding: 30px 20px;
    text-align: center;
    background: #181818;
}

header h1 {
    margin: 0;
    font-size: 36px;
}

header p {
    color: #aaa;
}

nav {
    text-align: center;
    padding: 15px;
    background: #222;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px;
}

.post {
    background: #1d1d1d;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 15px;
}

.post h2 {
    margin-top: 0;
}

.button {
    display: inline-block;
    background: #ff5500;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

/* Mobile */

@media (max-width: 600px) {

    header h1 {
        font-size: 30px;
    }

    nav a {
        margin: 0 5px;
        font-size: 14px;
    }

    .container {
        padding: 15px;
    }

    #skipBtn {
        top: 15px;
        left: 15px;
        padding: 8px 15px;
    }
}
</style>
</head>

<body>

<!-- =========================
     INTRO
========================= -->

<div id="intro">

    <!-- نام فایل GIF را اینجا قرار بده -->
    <img src="intro.gif" alt="Tsound Intro">

    <button id="skipBtn">
        SKIP
    </button>

</div>


<!-- =========================
     MAIN WEBSITE
========================= -->

<header>
    <h1>Tsound</h1>
    <p>وبلاگ موسیقی و هنر</p>
</header>

<nav>
    <a href="#">خانه</a>
    <a href="#">موسیقی</a>
    <a href="#">نوشته‌ها</a>
    <a href="#">درباره من</a>
</nav>

<div class="container">

    <div class="post">
        <h2>به وبلاگ Tsound خوش آمدید 🎵</h2>

        <p>
            اینجا می‌توانید اخبار، آهنگ‌ها، موزیک‌ویدیوها
            و مطالب جدید موسیقی را دنبال کنید.
        </p>

        <a class="button" href="#">
            ادامه مطلب
        </a>
    </div>

    <div class="post">
        <h2>آخرین آهنگ</h2>

        <p>
            به‌زودی آهنگ‌های جدید در این قسمت قرار می‌گیرند.
        </p>
    </div>

</div>

<footer>
    © 2026 Tsound
</footer>


<script>

/* =========================
   INTRO SETTINGS
========================= */

const intro = document.getElementById("intro");
const skipBtn = document.getElementById("skipBtn");

/*
   مدت زمان نمایش Intro
   این مقدار را بر اساس طول GIF تغییر بده.

   مثال:
   5 ثانیه  = 5000
   8 ثانیه  = 8000
   10 ثانیه = 10000
*/

const introDuration = 8000;


/* ورود به سایت */

function enterSite() {
    intro.classList.add("hidden");

    // بعد از محو شدن کامل، Intro از صفحه حذف شود
    setTimeout(() => {
        intro.style.display = "none";
    }, 800);
}


/* دکمه SKIP */

skipBtn.addEventListener("click", () => {
    enterSite();
});


/* ورود خودکار بعد از پایان Intro */

setTimeout(() => {
    enterSite();
}, introDuration);

</script>

</body>
</html>
